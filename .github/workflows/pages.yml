name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test ve web derlemesi
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Testleri çalıştır
        run: npm test

      - name: Web arayüzünü derle
        run: npm run web:build

      - name: GitHub Pages yapılandır
        uses: actions/configure-pages@v5

      - name: Dağıtım paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: GitHub Pages yayını
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages üzerine dağıt
        id: deployment
        uses: actions/deploy-pages@v4
